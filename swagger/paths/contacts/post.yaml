tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create new contact'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380123456789'
          email:
            description: "Contact's email"
            type: string
            example: 'johndoe@gmail.com'
          contactType:
            description: 'Contact category'
            type: string
            enum: ['work', 'home', 'personal']
            example: home
            default: personal
          isFavourite:
            description: 'Favorite mark'
            type: boolean
            example: false
            default: false
          photo:
            description: "Contact's photo"
            type: string
            format: binary
            default: null
responses:
  '201':
    description: 'Created contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created a contact!'
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
