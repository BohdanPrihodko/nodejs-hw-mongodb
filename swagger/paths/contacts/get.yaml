tags:
  - Contacts
summary: Get contacts
operationId: getContacts
description: 'Get list of contacts with this endpoint'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: string
      example: 1
  - in: query
    name: perPage
    schema:
      type: string
      example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      enum: ['_id', 'name']
      example: name
      default: _id
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: desc

responses:
  '200':
    description: 'Get contacts'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts'
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
            page:
              description: 'Current page number'
              type: integer
              example: 1
            perPage:
              description: 'Number of items per page'
              type: integer
              example: 10
            totalItems:
              description: 'Total number of contacts'
              type: integer
              example: 2
            totalPages:
              description: 'Total number of pages'
              type: integer
              example: 1
            hasPreviousPage:
              description: 'Indicates if there is a previous page'
              type: boolean
              example: false
            hasNextPage:
              description: 'Indicates if there is a next page'
              type: boolean
              example: false
  '401':
    $ref: ../../components/responses/401.yaml
